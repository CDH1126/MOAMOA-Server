name: Metadata Validation

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  issue:
    if: github.event_name == 'issues'
    name: Issue Convention Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: convention-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/convention-check.cjs').run({ github, context, core });

  pr:
    if: github.event_name == 'pull_request'
    name: PR Convention Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: convention-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/convention-check.cjs').run({ github, context, core });
